name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours to pick up new meetings
  workflow_run:
    # Redeploy as soon as fresh summaries land on the summaries branch.
    workflows: ["Summarize Meeting Items"]
    types: [completed]
  workflow_dispatch:          # Manual trigger from GitHub UI

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch transcripts branch
        run: |
          git fetch origin transcripts:refs/remotes/origin/transcripts || echo "No transcripts branch yet"
          git show origin/transcripts:transcripts/ 2>/dev/null && echo "Transcripts branch loaded" || echo "No transcripts available"

      - name: Fetch summaries branch
        run: |
          git fetch origin summaries:refs/remotes/origin/summaries || echo "No summaries branch yet"
          git show origin/summaries:summaries/ 2>/dev/null && echo "Summaries branch loaded" || echo "No summaries available"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
