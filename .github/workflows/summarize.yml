name: Summarize Meeting Items

on:
  # Run after transcription finishes (fresh transcripts may be available)
  workflow_run:
    workflows: ["Transcribe Meeting Videos"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tabs:
        description: 'Tab slugs to process (space-separated, empty = all)'
        required: false
        default: 'council'
      limit:
        description: 'Max meetings per tab'
        required: false
        default: '2'
      force:
        description: 'Redo meetings whose summaries are already current (not for the backfill)'
        type: boolean
        required: false
        default: false
      since:
        description: 'Only meetings on or after this date (backfill: 2024-11-01)'
        required: false
        default: ''
      pages:
        description: 'Pages of past meetings to walk per tab'
        required: false
        default: '1'

concurrency:
  group: summarize
  cancel-in-progress: false

permissions:
  contents: write   # push to summaries branch

jobs:
  summarize:
    runs-on: ubuntu-latest
    # The current-term backfill is ~226 meetings and will not fit in one
    # run.  That is fine: a meeting whose summaries are already in the
    # current format is skipped, so dispatching repeatedly walks forward
    # instead of redoing the last batch.  Leave `force` off for the
    # backfill -- it turns that skip off and the run stops converging.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for orphan-branch worktrees

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install google-genai

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Summarize meetings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LIMIT="${{ inputs.limit || '2' }}"
          TABS="${{ inputs.tabs || '' }}"

          SINCE="${{ inputs.since || '' }}"
          PAGES="${{ inputs.pages || '1' }}"

          ARGS="--limit $LIMIT --pages $PAGES"
          if [ -n "$TABS" ]; then
            ARGS="$ARGS --tabs $TABS"
          fi
          if [ -n "$SINCE" ]; then
            ARGS="$ARGS --since $SINCE"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          python scripts/summarize_meetings.py $ARGS
