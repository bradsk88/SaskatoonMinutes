name: Summarize Meeting Items

on:
  # Run after transcription finishes (fresh transcripts may be available)
  workflow_run:
    workflows: ["Transcribe Meeting Videos"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tabs:
        description: 'Tab slugs, space-separated (empty = all 16). e.g. council public-hearing planning'
        required: false
        default: ''
      limit:
        description: 'Max meetings per tab'
        required: false
        default: '2'
      force:
        description: 'Redo meetings whose summaries are already current (not for the backfill)'
        type: boolean
        required: false
        default: false
      since:
        description: 'Only meetings on or after this date. Set an older date to reach the archive.'
        required: false
        default: '2024-11-01'
      pages:
        description: 'Pages of past meetings to walk per tab'
        required: false
        default: '1'

concurrency:
  group: summarize
  # Deliberately false, and it stays false.  A queued second run once
  # started into an already-spent quota and wrote 28 empty meetings, but
  # cancelling is the wrong cure: this job runs up to 350 minutes, and
  # killing it mid-flight loses the meeting in progress and cancels the
  # legitimate run that follows Transcribe.  The script now stops on the
  # first per-day quota rejection, so the queued run exits in seconds and
  # says why.
  cancel-in-progress: false

permissions:
  contents: write   # push to summaries branch

jobs:
  summarize:
    runs-on: ubuntu-latest
    # The current term is ~227 meetings and will not fit in one run.
    # That is fine, and needs no manual backfill: a meeting whose
    # summaries are already in the current format is skipped, so the
    # scheduled run walks forward two meetings per tab per day and covers
    # the term in about ten days.  Leave `force` off -- it turns that
    # skip off and the run stops converging.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for orphan-branch worktrees

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install google-genai

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Summarize meetings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LIMIT="${{ inputs.limit || '2' }}"
          TABS="${{ inputs.tabs || '' }}"

          # Defaulted, not left empty.  The scheduled run passes no
          # inputs, and every cached summary in the archive predates the
          # ItemSummary aggregate -- so an empty --since would have the
          # daily job walk backwards through ~429 pre-term meetings that
          # are meant to keep their Legacy summaries.  A dispatch can
          # still reach further back by setting `since` explicitly.
          SINCE="${{ inputs.since || '2024-11-01' }}"
          PAGES="${{ inputs.pages || '1' }}"

          ARGS="--limit $LIMIT --pages $PAGES"
          if [ -n "$TABS" ]; then
            ARGS="$ARGS --tabs $TABS"
          fi
          if [ -n "$SINCE" ]; then
            ARGS="$ARGS --since $SINCE"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          python scripts/summarize_meetings.py $ARGS
