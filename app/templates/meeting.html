{% extends "base.html" %}

{% block title %}Meeting Details - Saskatoon Council Summarizer{% endblock %}

{% block content %}
<section class="meeting-detail">
    <a href="/" class="back-link">&larr; Back to all meetings</a>

    <div id="meeting-header">
        <div class="loading">Loading meeting details...</div>
    </div>

    <div id="video-section" class="video-section" style="display: none;">
        <h2>Meeting Video</h2>
        <div class="video-container">
            <iframe id="video-frame" src="" allowfullscreen></iframe>
        </div>
        <div id="video-loading" class="video-loading-bar" style="display: none;">
            Jumping to timestamp...
        </div>
    </div>

    <div class="agenda-controls">
        <h2>Agenda Items</h2>
        <div id="sort-toggle" class="sort-toggle" style="display: none;">
            <button class="sort-option" data-sort="video">Video order</button>
            <button class="sort-option" data-sort="agenda">Agenda order</button>
        </div>
    </div>

    <div id="agenda-items" class="agenda-items">
        <div class="loading">Loading agenda...</div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const meetingId = "{{ meeting_id }}";
    let meetingTitle = "";
    let videoUrl = null;
    let currentItems = [];
    let sortByVideo = true;

    async function loadMeeting() {
        const headerEl = document.getElementById('meeting-header');
        const agendaEl = document.getElementById('agenda-items');
        const videoSection = document.getElementById('video-section');
        try {
            let data;
            const preloadedEl = document.getElementById('preloaded-meeting');
            if (preloadedEl) {
                data = JSON.parse(preloadedEl.textContent);
            } else {
                const resp = await fetch(`/api/meeting/${meetingId}`);
                data = await resp.json();
            }

            if (data.error) {
                headerEl.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                return;
            }

            videoUrl = data.video_url;

            // Show video if available
            if (videoUrl) {
                videoSection.style.display = 'block';
                document.getElementById('video-frame').src = videoUrl;
            }

            // Render agenda items
            const items = data.agenda_items;
            if (items.length === 0) {
                agendaEl.innerHTML = '<div class="empty">No agenda items found for this meeting. The eSCRIBE page structure may have changed.</div>';
                headerEl.innerHTML = `
                    <h1>City Council Meeting</h1>
                    <p>
                        <a href="https://pub-saskatoon.escribemeetings.com/Meeting.aspx?Id=${meetingId}&Agenda=Agenda&lang=English"
                           target="_blank" rel="noopener">
                            View on eSCRIBE &rarr;
                        </a>
                    </p>
                `;
                return;
            }

            headerEl.innerHTML = `
                <h1>City Council Meeting</h1>
                <p class="meeting-meta-detail">
                    ${items.length} agenda items
                    ${videoUrl ? ' &middot; Video available' : ''}
                    &middot;
                    <a href="https://pub-saskatoon.escribemeetings.com/Meeting.aspx?Id=${meetingId}&Agenda=Agenda&lang=English"
                       target="_blank" rel="noopener">
                        View on eSCRIBE &rarr;
                    </a>
                </p>
            `;

            currentItems = items;
            if (videoUrl) {
                document.getElementById('sort-toggle').style.display = '';
                updateSortButtons();
            }
            renderAgendaItems(sortedItems());

        } catch (err) {
            headerEl.innerHTML = `<div class="error">Failed to load meeting details.</div>`;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function decodeEntities(str) {
        if (!str) return '';
        return str.replace(/&#58;/g, ':').replace(/&#160;/g, ' ')
                  .replace(/&amp;/g, '&').replace(/&quot;/g, '"')
                  .replace(/&lt;/g, '<').replace(/&gt;/g, '>');
    }

    function buildTranscriptHtml(item) {
        const content = decodeEntities(item.content || '');
        const rec = decodeEntities(item.recommendation || '');
        const vote = item.vote_result || '';
        const voteDetail = decodeEntities(item.vote_detail || '');

        if (!content && !rec && !vote) return '';

        let parts = '';

        if (content) {
            parts += `<div class="transcript-block">
                <div class="transcript-label">Description</div>
                <div class="transcript-text">${escapeHtml(content)}</div>
            </div>`;
        }

        if (rec) {
            parts += `<div class="transcript-block">
                <div class="transcript-label">Recommendation</div>
                <div class="transcript-text">${escapeHtml(rec)}</div>
            </div>`;
        }

        if (vote) {
            const contested = item.is_contested;
            const voteClass = contested ? 'vote-contested' : 'vote-carried';
            parts += `<div class="transcript-block">
                <div class="transcript-label">Vote</div>
                <div class="transcript-vote ${voteClass}">${escapeHtml(vote)}</div>
                ${voteDetail ? `<div class="transcript-vote-detail">${escapeHtml(voteDetail)}</div>` : ''}
            </div>`;
        }

        return `<div class="transcript-content">${parts}</div>`;
    }

    function computeOutOfOrder(items) {
        // Build video-order ranks for items that have timestamps
        const withTs = items
            .map((item, i) => ({ agendaIdx: i, ts: item.time_start_ms }))
            .filter(x => x.ts !== null);
        if (withTs.length < 2) return new Map();

        const sorted = [...withTs].sort((a, b) => a.ts - b.ts);
        const videoRank = new Map();
        sorted.forEach((x, rank) => videoRank.set(x.agendaIdx, rank));
        const agendaRank = new Map();
        withTs.forEach((x, rank) => agendaRank.set(x.agendaIdx, rank));

        const result = new Map();
        for (const x of withTs) {
            const diff = agendaRank.get(x.agendaIdx) - videoRank.get(x.agendaIdx);
            // Only flag if shifted by 2+ positions
            if (Math.abs(diff) >= 2) {
                result.set(x.agendaIdx, diff > 0 ? 'earlier' : 'later');
            }
        }
        return result;
    }

    function buildItemEl(item, outOfOrder, idx) {
        const el = document.createElement('div');
        el.className = 'agenda-item';
        el.dataset.itemId = item.item_id;

        const isConsent = item.timestamp_inherited === true;
        if (isConsent) el.classList.add('agenda-item-consent');

        const hasTimestamp = item.time_start_ms !== null;
        let timestampHtml = '';
        if (isConsent) {
            timestampHtml = `<span class="badge badge-consent">Consent agenda</span>`;
        } else if (hasTimestamp) {
            timestampHtml = `<button class="timestamp-link" onclick="seekVideo(${item.time_start_ms})"
                 title="Jump to this item in the video">
                 &#9654; ${item.time_start_formatted}
               </button>`;
        }

        const ooo = outOfOrder.get(idx);
        const oooBadgeHtml = ooo
            ? `<span class="badge badge-reorder">Discussed ${ooo} in video</span>`
            : '';

        const badgesHtml = (item.badges || [])
            .map(b => `<span class="topic-badge badge-${escapeHtml(b.type)}">${escapeHtml(b.label)}</span>`)
            .join(' ');

        const summaryHtml = item.summary
            ? `<p class="item-summary">${item.summary}</p>`
            : '';

        const transcriptHtml = isConsent ? '' : buildTranscriptHtml(item);

        el.innerHTML = `
            <div class="item-header">
                <span class="item-number">${item.section_number}</span>
                <span class="item-title">${item.title}</span>
                ${oooBadgeHtml}
                ${timestampHtml}
            </div>
            ${badgesHtml ? `<div class="item-badges">${badgesHtml}</div>` : ''}
            ${summaryHtml}
            ${transcriptHtml}
        `;
        return el;
    }

    function renderAgendaItems(items, animate) {
        const container = document.getElementById('agenda-items');
        const outOfOrder = computeOutOfOrder(items);

        container.innerHTML = '';
        const STAGGER = 60;
        items.forEach((item, idx) => {
            const el = buildItemEl(item, outOfOrder, idx);
            if (animate) {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-20px)';
            }
            container.appendChild(el);
        });
        applyTranscriptClamps();

        if (animate) {
            container.querySelectorAll('.agenda-item').forEach((el, i) => {
                el.animate([
                    { opacity: 0, transform: 'translateY(-20px)' },
                    { opacity: 1, transform: 'translateY(0)' }
                ], { duration: 450, delay: i * STAGGER, fill: 'forwards', easing: 'ease-out' });
            });
        }
    }

    function applyTranscriptClamps() {
        const CLAMP_HEIGHT = 96; // ~6.2em at default font size
        document.querySelectorAll('.transcript-content').forEach(el => {
            if (el.scrollHeight > CLAMP_HEIGHT) {
                el.classList.add('transcript-clamped', 'transcript-clampable');
            }
        });
    }

    // Click to toggle clamp on overflowing transcripts
    document.getElementById('agenda-items').addEventListener('click', function(e) {
        const el = e.target.closest('.transcript-clampable');
        if (!el) return;
        el.classList.toggle('transcript-clamped');
    });

    function seekVideo(timeMs) {
        const iframe = document.getElementById('video-frame');
        const bar = document.getElementById('video-loading');
        if (videoUrl) {
            const seekSeconds = Math.floor(timeMs / 1000);
            bar.style.display = 'block';
            iframe.src = videoUrl + `&initial_seek=${seekSeconds}&auto_play=true`;
            iframe.onload = function() {
                setTimeout(function() {
                    bar.style.opacity = '0';
                    setTimeout(function() {
                        bar.style.display = 'none';
                        bar.style.opacity = '1';
                    }, 5000);
                }, 4000);
            };
            document.getElementById('video-section').scrollIntoView({ behavior: 'smooth' });
        }
    }

    function sortedItems() {
        if (!sortByVideo) return currentItems;
        // Items with timestamps sorted by time, then items without at the end
        const withTs = currentItems.filter(i => i.time_start_ms !== null);
        const withoutTs = currentItems.filter(i => i.time_start_ms === null);
        withTs.sort((a, b) => a.time_start_ms - b.time_start_ms);
        return [...withTs, ...withoutTs];
    }

    function updateSortButtons() {
        document.querySelectorAll('.sort-option').forEach(btn => {
            const isActive = (btn.dataset.sort === 'video') === sortByVideo;
            btn.classList.toggle('sort-active', isActive);
        });
    }

    document.getElementById('sort-toggle').addEventListener('click', function(e) {
        const btn = e.target.closest('.sort-option');
        if (!btn) return;
        sortByVideo = btn.dataset.sort === 'video';
        updateSortButtons();
        renderAgendaItems(sortedItems(), true);
    });

    loadMeeting().then(() => {
        const params = new URLSearchParams(window.location.search);
        const t = params.get('t');
        if (t && videoUrl) {
            seekVideo(parseInt(t, 10));
        }
    });
</script>
{% endblock %}
