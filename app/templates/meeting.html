{% extends "base.html" %}

{% block title %}Meeting Details - YXEMinutes{% endblock %}

{% block content %}
<button id="back-to-top" class="back-to-top" aria-label="Back to top">&uarr; Top</button>

<section class="meeting-detail">
    <a href="/" class="back-link">&larr; Back to all meetings</a>

    <div id="video-section" class="video-section" style="display: none;">
        <div class="video-container">
            <iframe id="video-frame" src="" allowfullscreen></iframe>
        </div>
        <div id="video-loading" class="video-loading-bar" style="display: none;">
            Jumping to timestamp...
        </div>
    </div>

    <div id="meeting-header">
        <div class="loading">Loading meeting details...</div>
    </div>

    <div class="agenda-controls">
        <h2>Agenda Items</h2>
        <div id="sort-toggle" class="sort-toggle" style="display: none;">
            <button class="sort-option" data-sort="video">Video order</button>
            <button class="sort-option" data-sort="agenda">Agenda order</button>
        </div>
    </div>

    <div id="agenda-items" class="agenda-items">
        <div class="loading">Loading agenda...</div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const meetingId = "{{ meeting_id }}";
    let meetingTitle = "";
    let videoUrl = null;
    let currentItems = [];
    let sortByVideo = true;

    async function loadMeeting() {
        const headerEl = document.getElementById('meeting-header');
        const agendaEl = document.getElementById('agenda-items');
        const videoSection = document.getElementById('video-section');
        try {
            let data;
            const preloadedEl = document.getElementById('preloaded-meeting');
            if (preloadedEl) {
                data = JSON.parse(preloadedEl.textContent);
            } else {
                const resp = await fetch(`/api/meeting/${meetingId}`);
                data = await resp.json();
            }

            if (data.error) {
                headerEl.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                return;
            }

            videoUrl = data.video_url;

            // Show video if available
            if (videoUrl) {
                videoSection.style.display = 'block';
                const tParam = new URLSearchParams(window.location.search).get('t');
                if (tParam) {
                    const seekSeconds = Math.floor(parseInt(tParam, 10) / 1000);
                    const bar = document.getElementById('video-loading');
                    const iframe = document.getElementById('video-frame');
                    bar.style.display = 'block';
                    iframe.src = videoUrl + `&initial_seek=${seekSeconds}&auto_play=true`;
                    iframe.onload = function() {
                        setTimeout(function() {
                            bar.style.opacity = '0';
                            setTimeout(function() {
                                bar.style.display = 'none';
                                bar.style.opacity = '1';
                            }, 5000);
                        }, 4000);
                    };
                } else {
                    document.getElementById('video-frame').src = videoUrl;
                }
                setupStickyVideo(videoSection);
            }

            // Render agenda items
            const items = data.agenda_items;
            if (items.length === 0) {
                agendaEl.innerHTML = '<div class="empty">No agenda items found for this meeting. The eSCRIBE page structure may have changed.</div>';
                headerEl.innerHTML = `
                    <h1>City Council Meeting</h1>
                    <p>
                        <a href="https://pub-saskatoon.escribemeetings.com/Meeting.aspx?Id=${meetingId}&Agenda=Agenda&lang=English"
                           target="_blank" rel="noopener">
                            View on eSCRIBE &rarr;
                        </a>
                    </p>
                `;
                return;
            }

            headerEl.innerHTML = `
                <h1>City Council Meeting</h1>
                <p class="meeting-meta-detail">
                    ${items.length} agenda items
                    ${videoUrl ? ' &middot; Video available' : ''}
                    &middot;
                    <a href="https://pub-saskatoon.escribemeetings.com/Meeting.aspx?Id=${meetingId}&Agenda=Agenda&lang=English"
                       target="_blank" rel="noopener">
                        View on eSCRIBE &rarr;
                    </a>
                </p>
            `;

            currentItems = items;
            if (videoUrl) {
                document.getElementById('sort-toggle').style.display = '';
                updateSortButtons();
            }
            renderAgendaItems(sortedItems());

        } catch (err) {
            headerEl.innerHTML = `<div class="error">Failed to load meeting details.</div>`;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function decodeEntities(str) {
        if (!str) return '';
        return str.replace(/&#58;/g, ':').replace(/&#160;/g, ' ')
                  .replace(/&amp;/g, '&').replace(/&quot;/g, '"')
                  .replace(/&lt;/g, '<').replace(/&gt;/g, '>');
    }

    function outcomeExplanation(voteResult, recommendation) {
        if (!voteResult) return '';
        const v = voteResult.toUpperCase();
        const r = (recommendation || '').toUpperCase();
        if (v.includes('DEFEATED'))
            return 'A majority of councillors voted against. This item was rejected.';
        if (v.includes('DEFERRED') || v.includes('TABLED'))
            return 'This item was postponed to a future meeting.';
        if (v.includes('WITHDRAWN'))
            return 'This item was pulled from consideration before a vote took place.';
        // A carried motion to defer is a deferral, not an approval
        if (/\bDEFER(?:RED)?\b/.test(r) || r.includes('TABLED'))
            return 'This item was postponed to a future meeting.';
        if (v.includes('UNANIMOUSLY') && v.includes('CARRIED'))
            return 'Every councillor voted in favour. This item is approved.';
        if (v.includes('CARRIED'))
            return 'A majority of councillors voted in favour. This item is approved.';
        if (v.includes('RECEIVED') || v.includes('NOTED'))
            return 'Council acknowledged this item. No vote or action was required.';
        return '';
    }

    function buildTranscriptHtml(item) {
        const content = decodeEntities(item.content || '');
        const rec = decodeEntities(item.recommendation || '');
        const vote = item.vote_result || '';
        const voteDetail = decodeEntities(item.vote_detail || '');

        if (!content && !rec && !vote) return '';

        let parts = '';

        if (content) {
            parts += `<div class="transcript-block">
                <div class="transcript-label">Description</div>
                <div class="transcript-text">${escapeHtml(content)}</div>
            </div>`;
        }

        if (rec) {
            parts += `<div class="transcript-block">
                <div class="transcript-label">Recommendation</div>
                <div class="transcript-text">${escapeHtml(rec)}</div>
            </div>`;
        }

        if (vote) {
            const contested = item.is_contested;
            const voteClass = contested ? 'vote-contested' : 'vote-carried';
            const explanation = outcomeExplanation(vote, rec);
            parts += `<div class="transcript-block">
                <div class="transcript-label">Vote</div>
                <div class="transcript-vote ${voteClass}">${escapeHtml(vote)}</div>
                ${explanation ? `<div class="transcript-vote-explanation">${explanation}</div>` : ''}
                ${voteDetail ? `<div class="transcript-vote-detail">${escapeHtml(voteDetail)}</div>` : ''}
            </div>`;
        }

        const attachments = item.attachments || [];
        if (attachments.length > 0) {
            const links = attachments
                .map(a => `<li><a class="attachment-link" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">${escapeHtml(a.name)}</a></li>`)
                .join('');
            parts += `<div class="transcript-block">
                <div class="transcript-label">Attachments</div>
                <ul class="attachment-list">${links}</ul>
            </div>`;
        }

        return `<div class="transcript-content">${parts}</div>`;
    }

    function buildAttachmentsOnlyHtml(item) {
        const attachments = item.attachments || [];
        if (attachments.length === 0) return '';
        const links = attachments
            .map(a => `<li><a class="attachment-link" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">${escapeHtml(a.name)}</a></li>`)
            .join('');
        return `<div class="transcript-content"><div class="transcript-block">
                <div class="transcript-label">Attachments</div>
                <ul class="attachment-list">${links}</ul>
            </div></div>`;
    }

    function computeOutOfOrder(items) {
        // Build video-order ranks for items that have timestamps
        const withTs = items
            .map((item, i) => ({ agendaIdx: i, ts: item.time_start_ms }))
            .filter(x => x.ts !== null);
        if (withTs.length < 2) return new Map();

        const sorted = [...withTs].sort((a, b) => a.ts - b.ts);
        const videoRank = new Map();
        sorted.forEach((x, rank) => videoRank.set(x.agendaIdx, rank));
        const agendaRank = new Map();
        withTs.forEach((x, rank) => agendaRank.set(x.agendaIdx, rank));

        const result = new Map();
        for (const x of withTs) {
            const diff = agendaRank.get(x.agendaIdx) - videoRank.get(x.agendaIdx);
            // Only flag if shifted by 2+ positions
            if (Math.abs(diff) >= 2) {
                result.set(x.agendaIdx, diff > 0 ? 'earlier' : 'later');
            }
        }
        return result;
    }

    function formatDuration(ms) {
        const totalMin = Math.round(ms / 60000);
        if (totalMin >= 60) {
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return m > 0 ? `${h}h ${m}min` : `${h}h`;
        }
        return `${totalMin}min`;
    }

    function formatTimestamp(ms) {
        const totalSec = Math.floor(ms / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return h > 0
            ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
            : `${m}:${String(s).padStart(2,'0')}`;
    }

    function buildRecessEl(item) {
        const el = document.createElement('div');
        el.className = 'agenda-item recess-item';
        if (item.time_start_ms !== null) el.dataset.timeMs = item.time_start_ms;
        const duration = item.time_end_ms - item.time_start_ms;
        el.innerHTML = `
            <div class="item-header recess-header">
                <span class="recess-icon">&#9208;</span>
                <span class="item-title recess-title">Recess</span>
                <span class="recess-duration">${formatDuration(duration)}</span>
                <button class="timestamp-link" onclick="seekVideo(${item.time_start_ms})"
                    data-tooltip="Jump to recess start in video">
                    ${formatTimestamp(item.time_start_ms)} &ndash; ${formatTimestamp(item.time_end_ms)}
                </button>
            </div>
        `;
        return el;
    }

    function buildItemEl(item, outOfOrder, idx) {
        if (item.is_recess) return buildRecessEl(item);

        const el = document.createElement('div');
        el.className = 'agenda-item';
        el.dataset.itemId = item.item_id;
        if (item.time_start_ms !== null) el.dataset.timeMs = item.time_start_ms;

        const isConsent = item.timestamp_inherited === true;
        if (isConsent) el.classList.add('agenda-item-consent');

        const hasTimestamp = item.time_start_ms !== null;
        let timestampHtml = '';
        if (isConsent) {
            timestampHtml = `<span class="badge badge-consent" data-tooltip="Approved as a group without individual discussion">Not discussed</span>`;
        } else if (hasTimestamp) {
            timestampHtml = `<button class="timestamp-link" onclick="seekVideo(${item.time_start_ms})"
                 data-tooltip="Jump to this item in the video">
                 &#9654; ${item.time_start_formatted}
               </button>`;
        }

        const ooo = outOfOrder.get(idx);
        const oooBadgeHtml = ooo
            ? `<span class="badge badge-reorder">Discussed ${ooo} in video</span>`
            : '';

        const attachCount = (item.attachments || []).length;
        const attachBadgeHtml = attachCount > 0
            ? `<button class="badge badge-attachments">${attachCount} Attachment${attachCount !== 1 ? 's' : ''}</button>`
            : '';

        const badgesHtml = (item.badges || [])
            .map(b => `<span class="badge topic-badge badge-${escapeHtml(b.type)}">${escapeHtml(b.label)}</span>`)
            .join(' ');

        const summaryHtml = item.summary
            ? `<p class="item-summary">${item.summary}</p>`
            : '';

        const transcriptHtml = isConsent
            ? buildAttachmentsOnlyHtml(item)
            : buildTranscriptHtml(item);

        el.innerHTML = `
            <div class="item-header">
                <span class="item-number">${item.section_number}</span>
                <span class="item-title">${item.title}</span>
                ${oooBadgeHtml}
                ${attachBadgeHtml}
                ${timestampHtml}
            </div>
            ${badgesHtml ? `<div class="item-badges">${badgesHtml}</div>` : ''}
            ${summaryHtml}
            ${transcriptHtml}
        `;
        return el;
    }

    function renderAgendaItems(items, animate) {
        const container = document.getElementById('agenda-items');
        const outOfOrder = computeOutOfOrder(items);

        container.innerHTML = '';
        const STAGGER = 60;
        items.forEach((item, idx) => {
            const el = buildItemEl(item, outOfOrder, idx);
            if (animate) {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-20px)';
            }
            container.appendChild(el);
        });
        applyTranscriptClamps();

        if (animate) {
            container.querySelectorAll('.agenda-item').forEach((el, i) => {
                el.animate([
                    { opacity: 0, transform: 'translateY(-20px)' },
                    { opacity: 1, transform: 'translateY(0)' }
                ], { duration: 450, delay: i * STAGGER, fill: 'forwards', easing: 'ease-out' });
            });
        }
    }

    function applyTranscriptClamps() {
        const CLAMP_HEIGHT = 96; // ~6.2em at default font size
        document.querySelectorAll('.transcript-content').forEach(el => {
            if (el.scrollHeight > CLAMP_HEIGHT) {
                el.classList.add('transcript-clamped', 'transcript-clampable');
            }
        });
    }

    // Click to toggle clamp on overflowing transcripts
    document.getElementById('agenda-items').addEventListener('click', function(e) {
        // Attachments badge: expand the transcript to reveal attachment links
        const attachBadge = e.target.closest('.badge-attachments');
        if (attachBadge) {
            const item = attachBadge.closest('.agenda-item');
            if (item) {
                const transcript = item.querySelector('.transcript-clamped');
                if (transcript) transcript.classList.remove('transcript-clamped');
                // Scroll so the attachment list is visible
                setTimeout(function() {
                    const attachBlock = item.querySelector('.attachment-list');
                    if (attachBlock) {
                        attachBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 50);
            }
            return;
        }

        // Ignore clicks on links/buttons inside the transcript
        if (e.target.closest('a, button')) return;
        const el = e.target.closest('.transcript-clampable');
        if (!el) return;

        // If expanded, only collapse when clicking the "Show less" area at the bottom
        if (!el.classList.contains('transcript-clamped')) {
            const rect = el.getBoundingClientRect();
            const clickY = e.clientY - rect.top;
            const showLessHeight = 30;
            if (clickY < rect.height - showLessHeight) return;
        }
        el.classList.toggle('transcript-clamped');
    });

    function setupStickyVideo(videoSection) {
        const container = videoSection.querySelector('.video-container');
        const sectionHeight = videoSection.offsetHeight;
        const containerWidth = container.offsetWidth;
        const containerHeight = container.offsetHeight;
        const isMobile = window.innerWidth <= 640;
        const aspectPct = (containerHeight / containerWidth * 100).toFixed(2);
        container.style.setProperty('--video-aspect', aspectPct + '%');
        const miniWidth = isMobile ? containerWidth : 320;
        const scale = miniWidth / containerWidth;
        const miniHeight = Math.round(containerHeight * scale);

        // Spacer preserves layout space when the video goes fixed.
        const spacer = document.createElement('div');
        spacer.className = 'video-spacer';
        spacer.style.height = sectionHeight + 'px';
        spacer.style.display = 'none';
        videoSection.parentNode.insertBefore(spacer, videoSection.nextSibling);

        // Sentinel placed before the section. It has height equal to
        // 75% of the section so the observer fires after 75% has
        // scrolled out, not immediately at the top edge.
        const sentinel = document.createElement('div');
        sentinel.style.height = Math.round(containerHeight * 0.75) + 'px';
        sentinel.style.marginBottom = -Math.round(containerHeight * 0.75) + 'px';
        sentinel.style.pointerEvents = 'none';
        videoSection.parentNode.insertBefore(sentinel, videoSection);

        var isSticky = false;

        var observer = new IntersectionObserver(function(entries) {
            var entry = entries[0];
            if (!entry.isIntersecting && entry.boundingClientRect.top < 0) {
                if (isSticky) return;
                isSticky = true;
                spacer.style.display = 'block';
                videoSection.style.width = miniWidth + 'px';
                videoSection.style.height = miniHeight + 'px';
                container.style.width = containerWidth + 'px';
                container.style.height = containerHeight + 'px';
                container.style.paddingBottom = '0';
                container.style.transform = 'scale(' + scale + ')';
                videoSection.classList.add('sticky');
            } else if (entry.isIntersecting) {
                if (!isSticky) return;
                isSticky = false;
                videoSection.classList.remove('sticky');
                videoSection.style.width = '';
                videoSection.style.height = '';
                container.style.width = '';
                container.style.height = '';
                container.style.paddingBottom = '';
                container.style.transform = '';
                spacer.style.display = 'none';
            }
        }, { threshold: 0 });

        observer.observe(sentinel);
    }

    function scrollToAgendaItem(timeMs) {
        const el = document.querySelector(`.agenda-item[data-time-ms="${timeMs}"]`);
        if (!el) return;
        // Expand clamped transcript so the user can read it
        const transcript = el.querySelector('.transcript-clamped');
        if (transcript) {
            transcript.classList.remove('transcript-clamped');
        }
        // Use a small delay so the sticky player has time to activate
        setTimeout(function() {
            const rect = el.getBoundingClientRect();
            const offset = window.scrollY + rect.top - (window.innerHeight / 2);
            window.scrollTo({ top: Math.max(0, offset), behavior: 'smooth' });
            el.classList.remove('highlight');
            void el.offsetWidth;
            el.classList.add('highlight');
        }, 50);
    }

    function seekVideo(timeMs) {
        const iframe = document.getElementById('video-frame');
        const bar = document.getElementById('video-loading');
        if (videoUrl) {
            const seekSeconds = Math.floor(timeMs / 1000);
            bar.style.display = 'block';
            iframe.src = videoUrl + `&initial_seek=${seekSeconds}&auto_play=true`;
            iframe.onload = function() {
                setTimeout(function() {
                    bar.style.opacity = '0';
                    setTimeout(function() {
                        bar.style.display = 'none';
                        bar.style.opacity = '1';
                    }, 5000);
                }, 4000);
            };
            scrollToAgendaItem(timeMs);
        }
    }

    function sortedItems() {
        if (!sortByVideo) return currentItems;
        // Items with timestamps sorted by time, then items without at the end
        const withTs = currentItems.filter(i => i.time_start_ms !== null);
        const withoutTs = currentItems.filter(i => i.time_start_ms === null);
        withTs.sort((a, b) => a.time_start_ms - b.time_start_ms);
        return [...withTs, ...withoutTs];
    }

    function updateSortButtons() {
        document.querySelectorAll('.sort-option').forEach(btn => {
            const isActive = (btn.dataset.sort === 'video') === sortByVideo;
            btn.classList.toggle('sort-active', isActive);
        });
    }

    document.getElementById('sort-toggle').addEventListener('click', function(e) {
        const btn = e.target.closest('.sort-option');
        if (!btn) return;
        sortByVideo = btn.dataset.sort === 'video';
        updateSortButtons();
        renderAgendaItems(sortedItems(), true);
    });

    // Back-to-top button
    const backToTop = document.getElementById('back-to-top');
    window.addEventListener('scroll', function() {
        backToTop.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });
    backToTop.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    loadMeeting().then(() => {
        const params = new URLSearchParams(window.location.search);
        const t = params.get('t');
        if (t) {
            scrollToAgendaItem(parseInt(t, 10));
        }
    });
</script>
{% endblock %}
