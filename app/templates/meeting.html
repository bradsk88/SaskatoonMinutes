{% extends "base.html" %}

{% block title %}Meeting Details - Saskatoon Council Summarizer{% endblock %}

{% block content %}
<section class="meeting-detail">
    <a href="/" class="back-link">&larr; Back to all meetings</a>

    <div id="meeting-header">
        <div class="loading">Loading meeting details...</div>
    </div>

    <div id="video-section" class="video-section" style="display: none;">
        <h2>Meeting Video</h2>
        <div class="video-container">
            <iframe id="video-frame" src="" allowfullscreen></iframe>
            <div id="video-loading" class="video-loading" style="display: none;">
                Loading video...
            </div>
        </div>
    </div>

    <div class="agenda-controls">
        <h2>Agenda Items</h2>
        <div class="summarize-controls" style="display: none;" id="summarize-controls">
            <span id="backend-label" class="backend-label"></span>
            <button id="summarize-btn" class="btn btn-primary">
                Generate Summaries
            </button>
        </div>
    </div>

    <div id="agenda-items" class="agenda-items">
        <div class="loading">Loading agenda...</div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const meetingId = "{{ meeting_id }}";
    let meetingTitle = "";
    let videoUrl = null;

    async function loadMeeting() {
        const headerEl = document.getElementById('meeting-header');
        const agendaEl = document.getElementById('agenda-items');
        const videoSection = document.getElementById('video-section');
        const summarizeBtn = document.getElementById('summarize-btn');

        try {
            const resp = await fetch(`/api/meeting/${meetingId}`);
            const data = await resp.json();

            if (data.error) {
                headerEl.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                return;
            }

            videoUrl = data.video_url;

            // Show video if available
            if (videoUrl) {
                videoSection.style.display = 'block';
                document.getElementById('video-frame').src = videoUrl;
            }

            // Render agenda items
            const items = data.agenda_items;
            if (items.length === 0) {
                agendaEl.innerHTML = '<div class="empty">No agenda items found for this meeting. The eSCRIBE page structure may have changed.</div>';
                headerEl.innerHTML = `
                    <h1>City Council Meeting</h1>
                    <p>
                        <a href="https://pub-saskatoon.escribemeetings.com/Meeting.aspx?Id=${meetingId}&Agenda=Agenda&lang=English"
                           target="_blank" rel="noopener">
                            View on eSCRIBE &rarr;
                        </a>
                    </p>
                `;
                return;
            }

            headerEl.innerHTML = `
                <h1>City Council Meeting</h1>
                <p class="meeting-meta-detail">
                    ${items.length} agenda items
                    ${videoUrl ? ' &middot; Video available' : ''}
                    &middot;
                    <a href="https://pub-saskatoon.escribemeetings.com/Meeting.aspx?Id=${meetingId}&Agenda=Agenda&lang=English"
                       target="_blank" rel="noopener">
                        View on eSCRIBE &rarr;
                    </a>
                </p>
            `;

            const backend = data.summarizer_backend || 'extractive';
            const backendLabels = {
                'extractive': 'Local (extractive)',
                'local': 'Local (AI model)',
            };
            document.getElementById('backend-label').textContent = `Engine: ${backendLabels[backend] || backend}`;
            document.getElementById('summarize-controls').style.display = 'flex';
            renderAgendaItems(items);

        } catch (err) {
            headerEl.innerHTML = `<div class="error">Failed to load meeting details.</div>`;
        }
    }

    function renderAgendaItems(items) {
        const container = document.getElementById('agenda-items');
        container.innerHTML = '';

        items.forEach(item => {
            const el = document.createElement('div');
            el.className = 'agenda-item';

            const hasTimestamp = item.time_start_ms !== null;
            const timestampHtml = hasTimestamp
                ? `<button class="timestamp-link" onclick="seekVideo(${item.time_start_ms})"
                     title="Jump to this item in the video">
                     &#9654; ${item.time_start_formatted}
                   </button>`
                : '';

            const summaryHtml = item.summary
                ? `<p class="item-summary">${item.summary}</p>`
                : '';

            el.innerHTML = `
                <div class="item-header">
                    <span class="item-number">${item.section_number}</span>
                    <span class="item-title">${item.title}</span>
                    ${timestampHtml}
                </div>
                ${summaryHtml}
            `;
            container.appendChild(el);
        });
    }

    function seekVideo(timeMs) {
        const iframe = document.getElementById('video-frame');
        const overlay = document.getElementById('video-loading');
        if (videoUrl) {
            const seekSeconds = Math.floor(timeMs / 1000);
            // Hide the iframe so the player's loading state is invisible,
            // and show the overlay in its place.
            iframe.style.visibility = 'hidden';
            overlay.style.display = 'flex';
            iframe.src = videoUrl + `&initial_seek=${seekSeconds}&auto_play=true`;
            // The iframe page loads fast, but the video player inside
            // still needs time to seek and render. Wait after onload.
            iframe.onload = function() {
                setTimeout(function() {
                    overlay.style.display = 'none';
                    iframe.style.visibility = 'visible';
                }, 4000);
            };
            document.getElementById('video-section').scrollIntoView({ behavior: 'smooth' });
        }
    }

    document.getElementById('summarize-btn').addEventListener('click', async function() {
        const btn = this;
        btn.textContent = 'Generating summaries...';
        btn.disabled = true;

        try {
            const resp = await fetch(`/api/meeting/${meetingId}?summarize=true&title=${encodeURIComponent(meetingTitle)}`);
            const data = await resp.json();

            if (data.error) {
                alert('Error generating summaries: ' + data.error);
                btn.textContent = 'Generate Summaries';
                btn.disabled = false;
                return;
            }

            renderAgendaItems(data.agenda_items);
            btn.textContent = 'Summaries Generated';
        } catch (err) {
            alert('Failed to generate summaries.');
            btn.textContent = 'Generate Summaries';
            btn.disabled = false;
        }
    });

    loadMeeting();
</script>
{% endblock %}
