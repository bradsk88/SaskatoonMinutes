{% extends "base.html" %}

{% block title %}Meeting Details - YXEMinutes{% endblock %}

{% block content %}
<button id="back-to-top" class="back-to-top" aria-label="Back to top">&uarr; Top</button>

<section class="meeting-detail">
    <a href="/" class="back-link">&larr; Back to all meetings</a>

    <div id="video-section" class="video-section" style="display: none;">
        <div class="video-container">
            <iframe id="video-frame" src="" allowfullscreen></iframe>
        </div>
        <div id="video-loading" class="video-loading-bar" style="display: none;">
            Jumping to timestamp...
        </div>
    </div>

    <div id="meeting-header">
        <div class="loading">Loading meeting details...</div>
    </div>

    <div class="agenda-controls">
        <h2>Agenda Items</h2>
        <div id="sort-toggle" class="sort-toggle" style="display: none;">
            <button class="sort-option" data-sort="video">Video order</button>
            <button class="sort-option" data-sort="agenda">Agenda order</button>
        </div>
    </div>

    <div id="agenda-items" class="agenda-items">
        <div class="loading">Loading agenda...</div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const meetingId = "{{ meeting_id }}";
    let meetingTitle = "";
    let videoUrl = null;
    let currentItems = [];
    let sortByVideo = true;

    async function loadMeeting() {
        const headerEl = document.getElementById('meeting-header');
        const agendaEl = document.getElementById('agenda-items');
        const videoSection = document.getElementById('video-section');
        try {
            let data;
            const preloadedEl = document.getElementById('preloaded-meeting');
            if (preloadedEl) {
                data = JSON.parse(preloadedEl.textContent);
            } else {
                const resp = await fetch(`/api/meeting/${meetingId}`);
                data = await resp.json();
            }

            if (data.error) {
                headerEl.innerHTML = `<div class="error">Error: ${escapeHtml(data.error)}</div>`;
                return;
            }

            videoUrl = data.video_url;

            // Show video if available
            if (videoUrl) {
                videoSection.style.display = 'block';
                const tParam = new URLSearchParams(window.location.search).get('t');
                if (tParam) {
                    const seekSeconds = Math.max(0, Math.floor(parseInt(tParam, 10) / 1000) - 15);
                    const bar = document.getElementById('video-loading');
                    const iframe = document.getElementById('video-frame');
                    bar.style.display = 'block';
                    iframe.src = videoUrl + `&initial_seek=${seekSeconds}&auto_play=true`;
                    iframe.onload = function() {
                        setTimeout(function() {
                            bar.style.opacity = '0';
                            setTimeout(function() {
                                bar.style.display = 'none';
                                bar.style.opacity = '1';
                            }, 5000);
                        }, 4000);
                    };
                } else {
                    document.getElementById('video-frame').src = videoUrl;
                }
                setupStickyVideo(videoSection);
            }

            setPageIdentity(data);

            // Render agenda items
            const items = data.agenda_items;
            if (items.length === 0) {
                agendaEl.innerHTML = '<div class="empty">No agenda items found for this meeting. The eSCRIBE page structure may have changed.</div>';
                headerEl.innerHTML = meetingHeaderHtml(data, null);
                return;
            }

            headerEl.innerHTML = meetingHeaderHtml(data, items.length);

            currentItems = items;
            if (videoUrl) {
                document.getElementById('sort-toggle').style.display = '';
                updateSortButtons();
            }
            renderAgendaItems(sortedItems());

        } catch (err) {
            headerEl.innerHTML = `<div class="error">Failed to load meeting details.</div>`;
        }
    }

    // --- Meeting identity -------------------------------------------------
    // A reader can arrive here from a search result or a bookmark, with no
    // card behind them. The page names the meeting itself.

    function readableDate(iso) {
        if (!iso) return '';
        const d = new Date(iso + 'T00:00:00');
        if (isNaN(d)) return '';
        return d.toLocaleDateString('en-CA', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
    }

    function readableTime(hhmm) {
        if (!hhmm) return '';
        const parts = hhmm.split(':');
        const h = parseInt(parts[0], 10);
        if (isNaN(h)) return '';
        const suffix = h < 12 ? 'AM' : 'PM';
        const hour12 = h % 12 === 0 ? 12 : h % 12;
        return `${hour12}:${parts[1]} ${suffix}`;
    }

    function meetingHeaderHtml(data, itemCount) {
        // An unnamed meeting says so. Naming the wrong body — every page
        // used to read "City Council Meeting" — is worse than naming none.
        const name = (data.title || '').trim() || 'Meeting';
        const date = readableDate(data.date);
        const time = readableTime(data.start_time);
        const escribeLink = `
            <a href="https://pub-saskatoon.escribemeetings.com/Meeting.aspx?Id=${encodeURIComponent(meetingId)}&Agenda=Agenda&lang=English"
               target="_blank" rel="noopener">View on eSCRIBE &rarr;</a>`;
        const when = [date, time].filter(Boolean).join(' &middot; ');
        // The header counts what the page draws, split by the weight it
        // draws them at. One number could not do this honestly: it said
        // "43 agenda items" above 73 rendered cards, because the count
        // excluded section headers and the page drew them anyway.
        const discussed = data.discussed_count;
        const consent = data.consent_count;
        const counts = data.scheduled
            ? (data.item_count != null ? `${data.item_count} agenda items` : '')
            : discussed != null
            ? [
                `${discussed} discussed`,
                consent ? `${consent} approved without debate` : '',
              ].filter(Boolean).join(' &middot; ')
            // An older build has neither count. Fall back rather than
            // print nothing where the meeting's size belongs.
            : (data.item_count != null ? `${data.item_count} agenda items`
               : (itemCount !== null ? `${itemCount} agenda items` : ''));
        const meta = [
            counts,
            data.video_url ? 'Video available' : '',
        ].filter(Boolean).join(' &middot; ');
        return `
            <h1>${escapeHtml(name)}</h1>
            ${when ? `<p class="meeting-when">${when}</p>` : ''}
            ${data.scheduled ? speakBlurbHtml(data) : ''}
            <p class="meeting-meta-detail">
                ${meta}${meta ? ' &middot; ' : ''}${escribeLink}
            </p>
        `;
    }

    // A Scheduled Meeting (not yet held) offers the "register to speak"
    // call-to-action where the meeting's own page can answer it: one
    // static blurb, one City form, and the computed Monday-5pm deadline.
    function speakBlurbHtml(data) {
        const url = data.register_to_speak_url
            || 'https://www.saskatoon.ca/submit-letterrequest-speak-council-and-committees';
        const deadline = readableDate(data.request_to_speak_deadline);
        return `<div class="speak-blurb">This meeting hasn't happened yet. `
            + `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">Send a letter or request to speak</a>`
            + (deadline ? ` by ${escapeHtml(deadline)}, 5:00 p.m.` : '')
            + `</div>`;
    }

    function setPageIdentity(data) {
        // The tab title is what a bookmark and a shared link show.
        const name = (data.title || '').trim();
        const date = readableDate(data.date);
        if (!name) return;
        document.title = date
            ? `${name}, ${date} - YXEMinutes`
            : `${name} - YXEMinutes`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Chip-view category → color group. Mirrors CATEGORY_GROUP in
    // app/item_categorizer.py; updates must stay in sync.
    const CHIP_GROUP = {
        "Outcome": "decision", "Vote Breakdown": "decision",
        "Amendment Made": "decision", "Dissenting View": "decision",
        "Cost & Funding": "money",
        "Debate Highlight": "context",
        "Data Cited": "context", "Unanswered Question": "context",
        "Delegation": "voices", "Staff vs. Council": "voices",
        "Public Sentiment": "voices", "Declared Conflict": "voices",
        "Who's Affected": "impact", "Equity Impact": "impact",
        "Environmental Impact": "impact", "Legal Risk Flagged": "impact",
        "Procedural Note": "future", "Related Item": "future",
        "Deferred From": "future", "Precedent Set": "future",
        "Next Step": "future", "Promise Made": "future",
    };

    function buildChipViewHtml(item) {
        const summary = item.summary || {};
        const chips = summary.chips || [];
        // Descriptions were a paragraph before they were bullets, and
        // the archive still holds strings; a string is one bullet.
        const raw = summary.description;
        const description = Array.isArray(raw) ? raw.filter(Boolean) : (raw ? [raw] : []);
        if (!description.length && !chips.length) {
            // No disclaimer here: there is no AI output on this branch to
            // qualify, and a caveat about summaries under "no summary"
            // reads as though one is being hidden.
            return `<div class="item-chip-view">
                <p class="chip-empty">No AI summary available for this item yet.</p>
            </div>`;
        }
        // The description is the lede — it is what someone reads instead of
        // the agenda. Chips are the supporting specifics beneath it.
        // The detail page shows every bullet — unlike the card, it is
        // not competing for row height.
        const descHtml = description.length
            ? `<ul class="item-description">${
                description.map(b => `<li>${escapeHtml(b)}</li>`).join('')
              }</ul>`
            : '';
        // A summary with chips but no description predates the mandatory
        // description field. Say so rather than presenting it as current.
        const legacyHtml = (!description.length && chips.length)
            ? `<p class="chip-legacy-note">Older summary — no plain-language description available.</p>`
            : '';
        const rows = chips.map(c => {
            const group = CHIP_GROUP[c.category] || "context";
            return `<div class="chip-row">
                <span class="chip chip-${group}">${escapeHtml(c.category)}</span>
                <span class="chip-text">${escapeHtml(c.text)}</span>
            </div>`;
        }).join('');
        return `<div class="item-chip-view">
            ${descHtml}
            ${legacyHtml}
            ${rows ? `<div class="chip-view-grid">${rows}</div>` : ''}
            <p class="item-ai-disclaimer">Summaries are AI-generated from the meeting transcript and may contain errors.</p>
        </div>`;
    }

    function decodeEntities(str) {
        if (!str) return '';
        return str.replace(/&#58;/g, ':').replace(/&#160;/g, ' ')
                  .replace(/&amp;/g, '&').replace(/&quot;/g, '"')
                  .replace(/&lt;/g, '<').replace(/&gt;/g, '>');
    }

    function outcomeExplanation(voteResult, recommendation) {
        if (!voteResult) return '';
        const v = voteResult.toUpperCase();
        const r = (recommendation || '').toUpperCase();
        if (v.includes('DEFEATED'))
            return 'A majority of councillors voted against. This item was rejected.';
        if (v.includes('DEFERRED') || v.includes('TABLED'))
            return 'This item was postponed to a future meeting.';
        if (v.includes('WITHDRAWN'))
            return 'This item was pulled from consideration before a vote took place.';
        // A carried motion to defer is a deferral, not an approval
        if (/\bDEFER(?:RED)?\b/.test(r) || r.includes('TABLED'))
            return 'This item was postponed to a future meeting.';
        if (v.includes('UNANIMOUSLY') && v.includes('CARRIED'))
            return 'Every councillor voted in favour. This item is approved.';
        if (v.includes('CARRIED'))
            return 'A majority of councillors voted in favour. This item is approved.';
        if (v.includes('RECEIVED') || v.includes('NOTED'))
            return 'Council acknowledged this item. No vote or action was required.';
        return '';
    }

    function buildTranscriptHtml(item) {
        const content = decodeEntities(item.content || '');
        const rec = decodeEntities(item.recommendation || '');
        const vote = item.vote_result || '';
        const voteDetail = decodeEntities(item.vote_detail || '');

        if (!content && !rec && !vote) return '';

        let parts = '';

        if (content) {
            parts += `<div class="transcript-block">
                <div class="transcript-label">Description</div>
                <div class="transcript-text">${escapeHtml(content)}</div>
            </div>`;
        }

        if (rec) {
            parts += `<div class="transcript-block">
                <div class="transcript-label">Recommendation</div>
                <div class="transcript-text">${escapeHtml(rec)}</div>
            </div>`;
        }

        if (vote) {
            const contested = item.is_contested;
            const voteClass = contested ? 'vote-contested' : 'vote-carried';
            const explanation = outcomeExplanation(vote, rec);
            parts += `<div class="transcript-block">
                <div class="transcript-label">Vote</div>
                <div class="transcript-vote ${voteClass}">${escapeHtml(vote)}</div>
                ${explanation ? `<div class="transcript-vote-explanation">${explanation}</div>` : ''}
                ${voteDetail ? `<div class="transcript-vote-detail">${escapeHtml(voteDetail)}</div>` : ''}
            </div>`;
        }

        const attachments = item.attachments || [];
        if (attachments.length > 0) {
            const links = attachments
                .map(a => `<li><a class="attachment-link" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">${escapeHtml(a.name)}</a>${gistHtml(a)}</li>`)
                .join('');
            parts += `<div class="transcript-block">
                <div class="transcript-label">Attachments</div>
                <ul class="attachment-list">${links}</ul>
            </div>`;
        }

        return `<div class="transcript-content">${parts}</div>`;
    }

    function buildSpeakersHtml(item) {
        const speakers = item.speakers || [];
        if (speakers.length === 0) return '';
        const cards = speakers.map(p => {
            // "Registered" is what we can say about someone we only know
            // filed to speak. Once the transcript tells us what they
            // argued, that is the better label — badging a speaker whose
            // remarks are printed underneath as merely "Registered"
            // contradicts the card it sits on.
            const spoke = (p.said || []).length > 0;
            const stanceClass = !spoke && p.source === 'registered' ? 'stance-registered'
                : p.stance ? `stance-${p.stance}` : 'stance-neutral';
            const stanceLabel = !spoke && p.source === 'registered' ? 'Registered'
                : p.stance === 'support' ? 'Support'
                : p.stance === 'concern' ? 'Concern'
                : 'Spoke';
            // The same chip, and the same colour, as the index card --
            // both read org_label and org_color off merge_remarks.
            const orgHtml = `<span class="org-chip org-chip-${
                p.org_color == null ? 'none' : p.org_color
            }">${escapeHtml(p.org_label || 'Resident')}</span>`;
            // What they argued, when a summarize run has reached this
            // meeting. Falls back to the roster line — a narrated
            // sentence from the minutes, or what they registered to
            // speak about — which says they came but not what they said.
            const said = p.said || [];
            const bodyHtml = said.length
                ? `<ul class="speaker-said">`
                  + said.map(s => `<li>${escapeHtml(s)}</li>`).join('')
                  + `</ul>`
                : `<p class="speaker-summary">${escapeHtml(p.summary)}</p>`;
            return `<div class="speaker-card">
                <div class="speaker-card-header">
                    <span class="speaker-name">${escapeHtml(p.name)}</span>
                    ${orgHtml}
                    <span class="badge speaker-stance ${stanceClass}">${stanceLabel}</span>
                </div>
                ${bodyHtml}
            </div>`;
        }).join('');
        return `<div class="speaker-section">
            <div class="speaker-section-title">Guest speakers <span class="speaker-count">${speakers.length}</span></div>
            <div class="speaker-list">${cards}</div>
        </div>`;
    }

    // One attachment's 5-Ws gist under its link.  Always provisional:
    // generated from the pre-meeting PDF and never revised.
    function gistHtml(a) {
        const g = a.gist;
        if (!g) return '';
        const rows = [
            ['What', g.what], ['Who', g.who], ['When', g.when],
            ['Where', g.where], ['Why', g.why],
        ].filter(([, v]) => v && v !== '—')
            .map(([k, v]) => `<tr><th>${k}</th><td>${escapeHtml(v)}</td></tr>`)
            .join('');
        return `<div class="gist-block">
            <span class="gist-provisional">Provisional gist — read the full document</span>
            <table class="gist-table">${rows}</table>
        </div>`;
    }

    function buildAttachmentsOnlyHtml(item) {
        const attachments = item.attachments || [];
        if (attachments.length === 0) return '';
        const links = attachments
            .map(a => `<li><a class="attachment-link" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">${escapeHtml(a.name)}</a>${gistHtml(a)}</li>`)
            .join('');
        return `<div class="transcript-content"><div class="transcript-block">
                <div class="transcript-label">Attachments</div>
                <ul class="attachment-list">${links}</ul>
            </div></div>`;
    }

    function computeOutOfOrder(items) {
        // Build video-order ranks for items that have timestamps
        const withTs = items
            .map((item, i) => ({ agendaIdx: i, ts: item.time_start_ms }))
            .filter(x => x.ts !== null);
        if (withTs.length < 2) return new Map();

        const sorted = [...withTs].sort((a, b) => a.ts - b.ts);
        const videoRank = new Map();
        sorted.forEach((x, rank) => videoRank.set(x.agendaIdx, rank));
        const agendaRank = new Map();
        withTs.forEach((x, rank) => agendaRank.set(x.agendaIdx, rank));

        const result = new Map();
        for (const x of withTs) {
            const diff = agendaRank.get(x.agendaIdx) - videoRank.get(x.agendaIdx);
            // Only flag if shifted by 2+ positions
            if (Math.abs(diff) >= 2) {
                result.set(x.agendaIdx, diff > 0 ? 'earlier' : 'later');
            }
        }
        return result;
    }

    function formatDuration(ms) {
        const totalMin = Math.round(ms / 60000);
        if (totalMin >= 60) {
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return m > 0 ? `${h}h ${m}min` : `${h}h`;
        }
        return `${totalMin}min`;
    }

    function formatTimestamp(ms) {
        const totalSec = Math.floor(ms / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return h > 0
            ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
            : `${m}:${String(s).padStart(2,'0')}`;
    }

    function buildRecessEl(item) {
        const el = document.createElement('div');
        el.className = 'agenda-item recess-item';
        if (item.time_start_ms !== null) el.dataset.timeMs = item.time_start_ms;
        const duration = item.time_end_ms - item.time_start_ms;
        el.innerHTML = `
            <div class="item-header recess-header">
                <span class="recess-icon">&#9208;</span>
                <span class="item-title recess-title">Recess</span>
                <span class="recess-duration">${formatDuration(duration)}</span>
                <button class="timestamp-link" onclick="seekVideo(${item.time_start_ms})"
                    data-tooltip="Jump to recess start in video">
                    ${formatTimestamp(item.time_start_ms)} &ndash; ${formatTimestamp(item.time_end_ms)}
                </button>
            </div>
        `;
        return el;
    }

    // A heading names the group below it and has nothing else to say.
    // Drawn as a card it carried a NOT DISCUSSED badge and a topic chip,
    // which read as a decision that had gone unexamined.
    function buildHeadingEl(item) {
        const el = document.createElement('div');
        el.className = 'agenda-heading';
        el.innerHTML = `<span>${escapeHtml(item.title)}</span>`;
        return el;
    }

    function buildItemEl(item, outOfOrder, idx) {
        if (item.is_recess) return buildRecessEl(item);
        if (item.is_heading) return buildHeadingEl(item);

        const el = document.createElement('div');
        el.className = 'agenda-item';
        el.dataset.itemId = item.item_id;
        // A stable address for one agenda item, which is what a feed
        // entry and a shared link both point at. Deliberately not the
        // video position: a consent item's timestamp belongs to its
        // parent section, so the items most likely to be missed were
        // exactly the ones that could not be pointed at.
        //
        // Synthetic Recess rows all carry item_id -1, so a meeting with
        // two recesses would emit the same id twice. They are drawn by
        // buildRecessEl and never reach here, but the guard says why.
        if (item.item_id >= 0) el.id = `item-${item.item_id}`;
        if (item.time_start_ms !== null) el.dataset.timeMs = item.time_start_ms;

        const isConsent = item.timestamp_inherited === true;
        if (isConsent) el.classList.add('agenda-item-consent');

        const hasTimestamp = item.time_start_ms !== null;
        let playBtnHtml = '';
        let durationHtml = '';
        if (isConsent) {
            playBtnHtml = `<span class="badge badge-consent" data-tooltip="Approved as a group without individual discussion">Not discussed</span>`;
        } else if (hasTimestamp) {
            durationHtml = (item.time_end_ms !== null && item.time_end_ms > item.time_start_ms)
                ? `<span class="item-duration">${formatDuration(item.time_end_ms - item.time_start_ms)}</span>`
                : '';
            playBtnHtml = `<button class="timestamp-link" onclick="seekVideo(${item.time_start_ms})"
                 data-tooltip="Jump to this item in the video">
                 &#9654; ${item.time_start_formatted}
               </button>`;
        }

        const ooo = outOfOrder.get(idx);
        const oooBadgeHtml = ooo
            ? `<span class="badge badge-reorder">Discussed ${ooo} in video</span>`
            : '';

        const attachCount = (item.attachments || []).length;
        const attachHtml = attachCount > 0
            ? `<button class="item-attach-count">${attachCount} Attachment${attachCount !== 1 ? 's' : ''}</button>`
            : '';

        const badgesHtml = (item.badges || [])
            .map(b => `<span class="badge topic-badge badge-${escapeHtml(b.type)}">${escapeHtml(b.label)}</span>`)
            .join(' ');

        const transcriptHtml = isConsent
            ? buildAttachmentsOnlyHtml(item)
            : buildTranscriptHtml(item);

        // A consent item's summary was written, cached, and then thrown
        // away here: the card showed a list of PDFs where the index card
        // showed the sentence. Passing in one motion is a statement about
        // how council decided, not about whether what they decided
        // matters -- a $1.2M loan to TCU Place went through on consent.
        const hasChips = !!item.summary
            // An empty bullet list is truthy in JS, so length is the test.
            && ((Array.isArray(item.summary.description)
                    ? item.summary.description.length > 0
                    : !!item.summary.description)
                || (Array.isArray(item.summary.chips) && item.summary.chips.length > 0));
        const viewMode = hasChips ? "chips" : "notes";
        el.dataset.view = viewMode;

        const toggleHtml = hasChips
            ? `<div class="item-view-toggle" role="tablist">
                <button class="view-option" data-view-option="chips" role="tab">Summary</button>
                <button class="view-option" data-view-option="notes" role="tab">Notes</button>
               </div>`
            : '';

        const chipsHtml = hasChips ? buildChipViewHtml(item) : '';
        const speakersHtml = buildSpeakersHtml(item);

        el.innerHTML = `
            <div class="item-header">
                <span class="item-number">${escapeHtml(item.section_number)}</span>
                <span class="item-title">${escapeHtml(item.title)}</span>
                ${oooBadgeHtml}
                ${attachHtml}
                ${durationHtml}
                ${playBtnHtml}
            </div>
            ${badgesHtml ? `<div class="item-badges">${badgesHtml}</div>` : ''}
            ${speakersHtml}
            ${toggleHtml}
            ${chipsHtml}
            <div class="item-notes-view">${transcriptHtml}</div>
        `;
        return el;
    }

    // Every meeting carries the same scaffolding — the call to order, the
    // conflict declarations, the adjournment, and the headings that stand
    // over nothing. Across 276 meetings not one of these has ever had a
    // summary written for it, and drawn as full cards they were 26 of the
    // 73 rows on June 24. They keep their place in the record, and their
    // play buttons, in one strip instead of twenty-six cards.
    function buildRoutineStripEl(items) {
        const rows = items.map(item => {
            const playHtml = item.time_start_ms !== null
                ? `<button class="timestamp-link" onclick="seekVideo(${item.time_start_ms})"
                     data-tooltip="Jump to this point in the video">
                     &#9654; ${item.time_start_formatted}
                   </button>`
                : '';
            return `<li class="routine-row">
                <span class="item-number">${escapeHtml(item.section_number)}</span>
                <span class="routine-title">${escapeHtml(item.title)}</span>
                ${playHtml}
            </li>`;
        }).join('');
        const el = document.createElement('details');
        el.className = 'routine-strip';
        el.innerHTML = `
            <summary class="routine-summary">
                Routine meeting business
                <span class="routine-count">${items.length}</span>
            </summary>
            <ul class="routine-list">${rows}</ul>
        `;
        return el;
    }

    function renderAgendaItems(allItems, animate) {
        const container = document.getElementById('agenda-items');
        // An older build has no flag on its rows, and everything stays a
        // card — the same page this one replaced.
        const kept = allItems.filter(i => !i.is_routine);
        const routine = allItems.filter(i => i.is_routine);
        // In video order a heading can end up separated from the items it
        // names: they are timed by when council discussed them, it is
        // timed by its parent section. A rule drawn over nothing reads as
        // a broken page, so it is dropped here rather than in the data --
        // the same heading is worth drawing in agenda order.
        const items = kept.filter((item, i) => {
            if (!item.is_heading) return true;
            const next = kept[i + 1];
            return !!next && !next.is_heading;
        });
        const outOfOrder = computeOutOfOrder(items);

        container.innerHTML = '';

        // What "Not discussed" means, said once in text. It used to live
        // only in the badge's hover tooltip, which a touch screen cannot
        // open — and repeating the sentence on all twenty items in a
        // consent block would drown the block it explains.
        if (items.some(i => i.timestamp_inherited === true && !i.is_recess)) {
            const legend = document.createElement('p');
            legend.className = 'agenda-legend';
            legend.textContent =
                'Items marked "Not discussed" were approved as a group, '
                + 'in one motion, without individual debate.';
            container.appendChild(legend);
        }

        const STAGGER = 60;
        items.forEach((item, idx) => {
            const el = buildItemEl(item, outOfOrder, idx);
            if (animate) {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-20px)';
            }
            container.appendChild(el);
        });
        if (routine.length) container.appendChild(buildRoutineStripEl(routine));
        applyTranscriptClamps();

        if (animate) {
            container.querySelectorAll('.agenda-item').forEach((el, i) => {
                el.animate([
                    { opacity: 0, transform: 'translateY(-20px)' },
                    { opacity: 1, transform: 'translateY(0)' }
                ], { duration: 450, delay: i * STAGGER, fill: 'forwards', easing: 'ease-out' });
            });
        }
        scrollToAnchoredItem(false);
    }

    // The browser resolves #item-58 while the page is still a skeleton —
    // the cards are drawn by this file, not served in the HTML — so by
    // the time the element exists the browser has already given up. A
    // reader arriving from a feed entry landed at the top of a 70-row
    // page, which is the failure the anchor was added to prevent.
    //
    // Reuses the reveal a timestamp link gets: centred rather than
    // pinned to the top, because the sticky player owns the top of the
    // viewport, and flashed, because a page that jumps without saying
    // where looks broken.
    function scrollToAnchoredItem(smooth) {
        const hash = window.location.hash;
        if (!hash.startsWith('#item-')) return;
        revealAgendaItem(document.getElementById(hash.slice(1)), smooth);
    }

    // Same page, different item: a hash change moves nothing on its own
    // once the page is already drawn. Smooth here, because the reader is
    // already looking at the page.
    window.addEventListener('hashchange', function() {
        scrollToAnchoredItem(true);
    });

    function applyTranscriptClamps() {
        const CLAMP_HEIGHT = 96; // ~6.2em at default font size
        document.querySelectorAll('.transcript-content').forEach(el => {
            if (el.scrollHeight > CLAMP_HEIGHT) {
                el.classList.add('transcript-clamped', 'transcript-clampable');
            }
        });
    }

    // Click to toggle clamp on overflowing transcripts
    document.getElementById('agenda-items').addEventListener('click', function(e) {
        // Per-item view toggle (Summary ↔ Notes)
        const viewBtn = e.target.closest('.view-option');
        if (viewBtn) {
            const item = viewBtn.closest('.agenda-item');
            if (item) {
                item.dataset.view = viewBtn.dataset.viewOption;
            }
            return;
        }

        // Attachments badge: expand the transcript to reveal attachment links
        const attachBadge = e.target.closest('.item-attach-count');
        if (attachBadge) {
            const item = attachBadge.closest('.agenda-item');
            if (item) {
                const transcript = item.querySelector('.transcript-clamped');
                if (transcript) transcript.classList.remove('transcript-clamped');
                // Scroll so the attachment list is visible
                setTimeout(function() {
                    const attachBlock = item.querySelector('.attachment-list');
                    if (attachBlock) {
                        attachBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 50);
            }
            return;
        }

        // Ignore clicks on links/buttons inside the transcript
        if (e.target.closest('a, button')) return;
        const el = e.target.closest('.transcript-clampable');
        if (!el) return;

        // If expanded, only collapse when clicking the "Show less" area at the bottom
        if (!el.classList.contains('transcript-clamped')) {
            const rect = el.getBoundingClientRect();
            const clickY = e.clientY - rect.top;
            const showLessHeight = 30;
            if (clickY < rect.height - showLessHeight) return;
        }
        el.classList.toggle('transcript-clamped');
    });

    function setupStickyVideo(videoSection) {
        const container = videoSection.querySelector('.video-container');
        const sectionHeight = videoSection.offsetHeight;
        const containerWidth = container.offsetWidth;
        const containerHeight = container.offsetHeight;
        const isMobile = window.innerWidth <= 640;
        const aspectPct = (containerHeight / containerWidth * 100).toFixed(2);
        container.style.setProperty('--video-aspect', aspectPct + '%');
        const miniWidth = isMobile ? containerWidth : 320;
        const scale = miniWidth / containerWidth;
        const miniHeight = Math.round(containerHeight * scale);

        // Spacer preserves layout space when the video goes fixed.
        const spacer = document.createElement('div');
        spacer.className = 'video-spacer';
        spacer.style.height = sectionHeight + 'px';
        spacer.style.display = 'none';
        videoSection.parentNode.insertBefore(spacer, videoSection.nextSibling);

        // Sentinel placed before the section. It has height equal to
        // 75% of the section so the observer fires after 75% has
        // scrolled out, not immediately at the top edge.
        const sentinel = document.createElement('div');
        sentinel.style.height = Math.round(containerHeight * 0.75) + 'px';
        sentinel.style.marginBottom = -Math.round(containerHeight * 0.75) + 'px';
        sentinel.style.pointerEvents = 'none';
        videoSection.parentNode.insertBefore(sentinel, videoSection);

        var isSticky = false;

        var observer = new IntersectionObserver(function(entries) {
            var entry = entries[0];
            if (!entry.isIntersecting && entry.boundingClientRect.top < 0) {
                if (isSticky) return;
                isSticky = true;
                spacer.style.display = 'block';
                videoSection.style.width = miniWidth + 'px';
                videoSection.style.height = miniHeight + 'px';
                container.style.width = containerWidth + 'px';
                container.style.height = containerHeight + 'px';
                container.style.paddingBottom = '0';
                container.style.transform = 'scale(' + scale + ')';
                videoSection.classList.add('sticky');
            } else if (entry.isIntersecting) {
                if (!isSticky) return;
                isSticky = false;
                videoSection.classList.remove('sticky');
                videoSection.style.width = '';
                videoSection.style.height = '';
                container.style.width = '';
                container.style.height = '';
                container.style.paddingBottom = '';
                container.style.transform = '';
                spacer.style.display = 'none';
            }
        }, { threshold: 0 });

        observer.observe(sentinel);
    }

    // *smooth* is right when the reader is already on the page and asked
    // to move — the animation shows them where they went. It is wrong on
    // arrival: landing from a feed entry means scrolling past seventy
    // items they did not ask to see, and the page is still settling, so
    // an animated scroll can be overtaken by layout and stop short.
    function centreOn(el, smooth) {
        const rect = el.getBoundingClientRect();
        const offset = window.scrollY + rect.top - (window.innerHeight / 2);
        window.scrollTo({
            top: Math.max(0, offset),
            behavior: smooth ? 'smooth' : 'auto',
        });
    }

    // *smooth* is right when the reader is already on the page and asked
    // to move — the animation shows them where they went. It is wrong on
    // arrival: landing from a feed entry means scrolling past seventy
    // items they did not ask to see.
    //
    // Arrival also scrolls twice. Scrolling activates the sticky player,
    // which changes the height of everything above the target, so the
    // first jump lands short — that is what the delay below was always
    // for. Waiting for it is fine when a reader clicked something and is
    // watching; on arrival the page would sit at the top for a beat
    // first, and a slow browser can capture the page before it moves at
    // all. So: put them there now, then correct.
    function revealAgendaItem(el, smooth = true) {
        if (!el) return;
        // Expand clamped transcript so the user can read it
        const transcript = el.querySelector('.transcript-clamped');
        if (transcript) {
            transcript.classList.remove('transcript-clamped');
        }
        if (!smooth) centreOn(el, false);
        // Use a small delay so the sticky player has time to activate
        setTimeout(function() {
            centreOn(el, smooth);
            el.classList.remove('highlight');
            void el.offsetWidth;
            el.classList.add('highlight');
        }, 50);
    }

    function scrollToAgendaItem(timeMs) {
        revealAgendaItem(
            document.querySelector(`.agenda-item[data-time-ms="${timeMs}"]`),
        );
    }

    function seekVideo(timeMs) {
        const iframe = document.getElementById('video-frame');
        const bar = document.getElementById('video-loading');
        if (videoUrl) {
            const seekSeconds = Math.max(0, Math.floor(timeMs / 1000) - 15);
            bar.style.display = 'block';
            iframe.src = videoUrl + `&initial_seek=${seekSeconds}&auto_play=true`;
            iframe.onload = function() {
                setTimeout(function() {
                    bar.style.opacity = '0';
                    setTimeout(function() {
                        bar.style.display = 'none';
                        bar.style.opacity = '1';
                    }, 5000);
                }, 4000);
            };
            scrollToAgendaItem(timeMs);
        }
    }

    function sortedItems() {
        if (!sortByVideo) return currentItems;
        // Items with timestamps sorted by time, then items without at the end
        const withTs = currentItems.filter(i => i.time_start_ms !== null);
        const withoutTs = currentItems.filter(i => i.time_start_ms === null);
        withTs.sort((a, b) => a.time_start_ms - b.time_start_ms);
        return [...withTs, ...withoutTs];
    }

    function updateSortButtons() {
        document.querySelectorAll('.sort-option').forEach(btn => {
            const isActive = (btn.dataset.sort === 'video') === sortByVideo;
            btn.classList.toggle('sort-active', isActive);
        });
    }

    document.getElementById('sort-toggle').addEventListener('click', function(e) {
        const btn = e.target.closest('.sort-option');
        if (!btn) return;
        sortByVideo = btn.dataset.sort === 'video';
        updateSortButtons();
        renderAgendaItems(sortedItems(), true);
    });

    // Back-to-top button
    const backToTop = document.getElementById('back-to-top');
    window.addEventListener('scroll', function() {
        backToTop.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });
    backToTop.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    loadMeeting().then(() => {
        // A card row now sends both: ?t= to seek the video, #item-<id>
        // to place the reader. The anchor already scrolled as the items
        // were drawn, so re-running the seek's scroll would reveal the
        // same row a second time and flash it twice.
        if (window.location.hash.startsWith('#item-')) return;
        const t = new URLSearchParams(window.location.search).get('t');
        if (t) {
            scrollToAgendaItem(parseInt(t, 10));
        }
    });
</script>
{% endblock %}
