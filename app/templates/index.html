{% extends "base.html" %}

{% block title %}Saskatoon Council Summarizer{% endblock %}

{% block content %}
<section class="hero">
    <h1>Saskatoon City Council Meetings</h1>
    <p>Browse recent council meetings and see what was discussed and decided.</p>
</section>

<section class="meetings-section">
    <h2>Recent Meetings</h2>
    <div id="meetings-featured" class="meetings-featured"></div>
    <div id="meetings-list" class="meetings-grid"></div>
    <div id="load-more-container" class="load-more-container" style="display: none;">
        <button id="load-more-btn" class="btn">Load More Meetings</button>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    let currentPage = 1;
    let totalCount = 0;
    const PAGE_SIZE = 50;
    const AUTO_SUMMARIZE_COUNT = 3;

    function skeletonCard(withTopics) {
        const topicLines = withTopics
            ? `<div class="skeleton-topics">
                   <div class="skeleton skeleton-line-sm long"></div>
                   <div class="skeleton skeleton-line-sm medium"></div>
                   <div class="skeleton skeleton-line-sm long"></div>
               </div>`
            : '';
        return `<div class="skeleton-card">
            <div class="skeleton skeleton-line short"></div>
            <div class="skeleton skeleton-line medium"></div>
            <div style="display:flex;gap:0.5rem;margin-top:0.25rem;">
                <div class="skeleton skeleton-badge"></div>
                <div class="skeleton skeleton-badge"></div>
            </div>
            ${topicLines}
        </div>`;
    }

    function topicsSkeleton() {
        return `<div class="skeleton-topics">
            <div class="skeleton skeleton-line-sm long"></div>
            <div class="skeleton skeleton-line-sm medium"></div>
            <div class="skeleton skeleton-line-sm long"></div>
            <div class="skeleton skeleton-line-sm short"></div>
        </div>`;
    }

    function escapeAttr(str) {
        return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                  .replace(/'/g, '&#39;').replace(/</g, '&lt;');
    }

    function outcomeClass(topic) {
        if (topic.is_contested) return 'outcome-contested';
        if (topic.outcome.startsWith('Defeated')) return 'outcome-defeated';
        if (topic.outcome.startsWith('Approved')) return 'outcome-approved';
        return 'outcome-neutral';
    }

    function renderTopicsTable(topics) {
        let html = '<table class="topics-table"><tbody>';
        topics.forEach(t => {
            const rowClass = t.is_major ? 'topic-major' : '';
            const oClass = outcomeClass(t);
            const tooltip = t.outcome_detail
                ? ` data-tooltip="${escapeAttr(t.outcome_detail)}"` : '';
            html += `<tr class="${rowClass}">`;
            html += `<td class="topic-name">${escapeAttr(t.topic)}</td>`;
            html += `<td class="topic-outcome"><span class="${oClass}"${tooltip}>${escapeAttr(t.outcome)}</span></td>`;
            html += `</tr>`;
        });
        html += '</tbody></table>';
        return html;
    }

    function buildCardHTML(m, dateStr, badges, isFeatured) {
        let topicsHtml;
        if (isFeatured) {
            topicsHtml = `
                <div class="meeting-topics" id="topics-${m.meeting_id}">
                    ${topicsSkeleton()}
                </div>`;
        } else {
            topicsHtml = `
                <div class="meeting-topics" id="topics-${m.meeting_id}">
                    <button class="btn btn-sm btn-topics" data-meeting-id="${m.meeting_id}"
                            data-meeting-title="${escapeAttr(m.title)}">
                        Show Key Topics
                    </button>
                </div>`;
        }

        return `
            <div class="meeting-date">${dateStr}</div>
            <div class="meeting-title">${m.title}</div>
            <div class="meeting-meta">
                ${m.start_time ? `<span>${m.start_time}</span>` : ''}
                ${badges.join(' ')}
            </div>
            ${topicsHtml}
        `;
    }

    async function loadTopics(meetingId, title) {
        const container = document.getElementById(`topics-${meetingId}`);
        if (!container) return;
        container.innerHTML = topicsSkeleton();

        try {
            const resp = await fetch(`/api/meeting/${meetingId}/topics?title=${encodeURIComponent(title)}`);
            const data = await resp.json();

            if (data.error) {
                container.innerHTML = '<div class="topics-error">Could not load topics.</div>';
                return;
            }

            if (!data.topics || data.topics.length === 0) {
                container.innerHTML = '<div class="topics-empty">No substantive topics found.</div>';
                return;
            }

            container.innerHTML = renderTopicsTable(data.topics);
        } catch (err) {
            container.innerHTML = '<div class="topics-error">Failed to load topics.</div>';
        }
    }

    async function loadMeetings(page) {
        const featured = document.getElementById('meetings-featured');
        const container = document.getElementById('meetings-list');
        const loadMoreBtn = document.getElementById('load-more-btn');
        const loadMoreContainer = document.getElementById('load-more-container');

        if (page === 1) {
            featured.innerHTML = skeletonCard(true) + skeletonCard(true) + skeletonCard(true);
            container.innerHTML = skeletonCard(false).repeat(6);
        } else {
            loadMoreBtn.textContent = 'Loading...';
            loadMoreBtn.disabled = true;
        }

        try {
            const resp = await fetch(`/api/meetings?page=${page}`);
            const data = await resp.json();

            if (data.error) {
                featured.innerHTML = '';
                container.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                return;
            }

            totalCount = data.total_count;
            const meetings = data.meetings;

            if (page === 1) {
                featured.innerHTML = '';
                container.innerHTML = '';
            }

            if (meetings.length === 0 && page === 1) {
                container.innerHTML = '<div class="empty">No meetings found.</div>';
                return;
            }

            const autoSummarize = [];

            meetings.forEach((m, index) => {
                const isFeatured = (page === 1 && index < AUTO_SUMMARIZE_COUNT);

                const card = document.createElement('div');
                card.className = 'meeting-card';
                card.style.cursor = 'pointer';
                card.dataset.href = `/meeting/${m.meeting_id}`;

                const date = new Date(m.date + 'T00:00:00');
                const dateStr = date.toLocaleDateString('en-CA', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                });

                const badges = [];
                if (m.has_video) badges.push('<span class="badge badge-video">Video</span>');
                if (m.has_agenda) badges.push('<span class="badge badge-agenda">Agenda</span>');

                card.innerHTML = buildCardHTML(m, dateStr, badges, isFeatured);

                // Navigate on card click, but not when clicking topics area
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.meeting-topics')) return;
                    window.location.href = card.dataset.href;
                });

                if (isFeatured) {
                    featured.appendChild(card);
                    autoSummarize.push(m);
                } else {
                    container.appendChild(card);
                }
            });

            // Auto-load topics for featured meetings (fire all in parallel)
            autoSummarize.forEach(m => {
                loadTopics(m.meeting_id, m.title);
            });

            const loaded = page * PAGE_SIZE;
            if (loaded < totalCount) {
                loadMoreContainer.style.display = 'flex';
                loadMoreBtn.textContent = `Load More (${Math.min(loaded, totalCount)} of ${totalCount})`;
                loadMoreBtn.disabled = false;
            } else {
                loadMoreContainer.style.display = 'none';
            }

            currentPage = page;
        } catch (err) {
            featured.innerHTML = '';
            container.innerHTML = `<div class="error">Failed to load meetings. Please try again.</div>`;
        }
    }

    // Delegate click on "Show Key Topics" buttons
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-topics');
        if (!btn) return;
        e.stopPropagation();
        const meetingId = btn.dataset.meetingId;
        const title = btn.dataset.meetingTitle;
        loadTopics(meetingId, title);
    });

    document.getElementById('load-more-btn').addEventListener('click', () => {
        loadMeetings(currentPage + 1);
    });

    loadMeetings(1);
</script>
{% endblock %}
