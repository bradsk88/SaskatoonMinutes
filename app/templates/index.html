{% extends "base.html" %}

{% block title %}Saskatoon Council Summarizer{% endblock %}

{% block content %}
<section class="hero">
    <h1>Saskatoon City Council Meetings</h1>
    <p>Browse recent council meetings and see what was discussed and decided.</p>
</section>

<section class="meetings-section">
    <h2>Recent Meetings</h2>
    <div id="meetings-list" class="meetings-grid"></div>
    <div id="scroll-sentinel" class="scroll-sentinel"></div>
    <div id="end-message" class="end-message" style="display: none;">
        All meetings loaded.
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const API_PAGE_SIZE = 50;
    const ESCRIBEMEETINGS_BASE = 'https://pub-saskatoon.escribemeetings.com';

    let apiPage = 1;
    let totalCount = 0;
    let buffer = [];
    let allFetched = false;
    let rendering = false;
    let observer = null;

    function calcBatchSize() {
        const viewportH = window.innerHeight;
        // Deduct fixed chrome: header ~56px, hero ~80px, section header ~40px, padding ~32px
        const usedHeight = 56 + 80 + 40 + 32;
        const available = viewportH - usedHeight;
        const cardHeight = 136; // ~120px card + 16px gap
        const count = Math.floor(available / cardHeight);
        return Math.max(3, count);
    }

    function skeletonCard() {
        return `<div class="skeleton-card">
            <div class="skeleton skeleton-line short"></div>
            <div class="skeleton skeleton-line medium"></div>
            <div style="display:flex;gap:0.5rem;margin-top:0.25rem;">
                <div class="skeleton skeleton-badge"></div>
                <div class="skeleton skeleton-badge"></div>
            </div>
            <div class="skeleton-topics">
                <div class="skeleton skeleton-line-sm long"></div>
                <div class="skeleton skeleton-line-sm medium"></div>
                <div class="skeleton skeleton-line-sm long"></div>
            </div>
        </div>`;
    }

    function topicsSkeleton() {
        return `<div class="skeleton-topics">
            <div class="skeleton skeleton-line-sm long"></div>
            <div class="skeleton skeleton-line-sm medium"></div>
            <div class="skeleton skeleton-line-sm long"></div>
            <div class="skeleton skeleton-line-sm short"></div>
        </div>`;
    }

    function escapeAttr(str) {
        return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                  .replace(/'/g, '&#39;').replace(/</g, '&lt;');
    }

    function outcomeClass(topic) {
        if (topic.is_contested) return 'outcome-contested';
        if (topic.outcome && topic.outcome.startsWith('Defeated')) return 'outcome-defeated';
        if (topic.outcome && topic.outcome.startsWith('Approved')) return 'outcome-approved';
        return 'outcome-neutral';
    }

    function renderTopicsTable(topics) {
        let html = '<table class="topics-table"><tbody>';
        topics.forEach(t => {
            const rowClass = t.is_major ? 'topic-major' : '';
            const oClass = outcomeClass(t);
            const tooltip = t.outcome_detail
                ? ` data-tooltip="${escapeAttr(t.outcome_detail)}"` : '';

            // Outcome badge (always first)
            let badgesHtml = `<span class="topic-badge badge-${oClass}"${tooltip}>${escapeAttr(t.outcome)}</span>`;

            // Extra extracted badges
            if (t.badges) {
                t.badges.forEach(b => {
                    badgesHtml += ` <span class="topic-badge badge-${escapeAttr(b.type)}">${escapeAttr(b.label)}</span>`;
                });
            }

            html += `<tr class="${rowClass}">`;
            html += `<td class="topic-cell">`;
            html += `<div class="topic-name">${escapeAttr(t.topic)}</div>`;
            html += `<div class="topic-badges">${badgesHtml}</div>`;
            html += `</td>`;
            html += `</tr>`;
        });
        html += '</tbody></table>';
        return html;
    }

    function buildCardHTML(m, dateStr, badges, openHref) {
        return `
            <div class="meeting-date">${dateStr}</div>
            <div class="meeting-title">${m.title}</div>
            <div class="meeting-meta">
                ${m.start_time ? `<span>${m.start_time}</span>` : ''}
                ${badges.join(' ')}
            </div>
            <div class="meeting-topics" id="topics-${m.meeting_id}">
                ${topicsSkeleton()}
            </div>
            <div class="meeting-card-actions">
                <a href="${openHref}" class="btn btn-sm btn-open">Open</a>
            </div>
        `;
    }

    function renderTopicsInContainer(meetingId, topics) {
        const container = document.getElementById(`topics-${meetingId}`);
        if (!container) return;

        if (!topics || topics.length === 0) {
            container.innerHTML = '<div class="topics-empty">No substantive topics found.</div>';
            return;
        }
        container.innerHTML = renderTopicsTable(topics);
    }

    async function loadTopics(meetingId, title) {
        const container = document.getElementById(`topics-${meetingId}`);
        if (!container) return;

        // Static mode: use preloaded topics if available
        const preloadedEl = document.getElementById('preloaded-topics');
        if (preloadedEl) {
            const allTopics = JSON.parse(preloadedEl.textContent);
            renderTopicsInContainer(meetingId, allTopics[meetingId]);
            return;
        }

        // Dynamic mode: fetch from API
        container.innerHTML = topicsSkeleton();

        try {
            const resp = await fetch(`/api/meeting/${meetingId}/topics?title=${encodeURIComponent(title)}`);
            const data = await resp.json();

            if (data.error) {
                container.innerHTML = '<div class="topics-error">Could not load topics.</div>';
                return;
            }

            renderTopicsInContainer(meetingId, data.topics);
        } catch (err) {
            container.innerHTML = '<div class="topics-error">Failed to load topics.</div>';
        }
    }

    function renderMeetingCards(meetings, targetGrid, isStatic) {
        meetings.forEach(m => {
            const card = document.createElement('div');
            card.className = 'meeting-card';

            let openHref;
            if (isStatic) {
                openHref = `${ESCRIBEMEETINGS_BASE}/Meeting.aspx?Id=${m.meeting_id}&Agenda=Agenda&lang=English`;
            } else {
                openHref = `/meeting/${m.meeting_id}`;
            }

            const date = new Date(m.date + 'T00:00:00');
            const dateStr = date.toLocaleDateString('en-CA', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });

            const badges = [];
            if (m.has_video) badges.push('<span class="badge badge-video">Video</span>');
            if (m.has_agenda) badges.push('<span class="badge badge-agenda">Agenda</span>');

            card.innerHTML = buildCardHTML(m, dateStr, badges, openHref);
            targetGrid.appendChild(card);
        });
    }

    async function fetchNextApiPage() {
        if (allFetched) return;
        try {
            const resp = await fetch(`/api/meetings?page=${apiPage}`);
            const data = await resp.json();
            if (data.error) throw new Error(data.error);

            totalCount = data.total_count;
            buffer.push(...data.meetings);
            apiPage++;

            if ((apiPage - 1) * API_PAGE_SIZE >= totalCount || data.meetings.length === 0) {
                allFetched = true;
            }
        } catch (err) {
            const container = document.getElementById('meetings-list');
            if (container.children.length === 0) {
                container.innerHTML = '<div class="error">Failed to load meetings. Please try again.</div>';
            }
            allFetched = true;
        }
    }

    async function renderBatch() {
        if (rendering) return;
        rendering = true;

        const container = document.getElementById('meetings-list');
        const batchSize = calcBatchSize();

        // Fetch more from API if buffer is too small
        if (buffer.length < batchSize && !allFetched) {
            await fetchNextApiPage();
        }

        const batch = buffer.splice(0, batchSize);

        if (batch.length === 0) {
            if (allFetched && container.children.length === 0) {
                container.innerHTML = '<div class="empty">No meetings found.</div>';
            }
            if (allFetched) {
                document.getElementById('end-message').style.display = 'block';
                if (observer) observer.disconnect();
            }
            rendering = false;
            return;
        }

        renderMeetingCards(batch, container, false);

        // Auto-summarize all meetings in the batch
        batch.forEach(m => loadTopics(m.meeting_id, m.title));

        // Pre-fetch next API page if buffer is running low
        if (buffer.length === 0 && !allFetched) {
            fetchNextApiPage(); // fire and forget
        }

        if (allFetched && buffer.length === 0) {
            document.getElementById('end-message').style.display = 'block';
            if (observer) observer.disconnect();
        }

        rendering = false;
    }

    function setupInfiniteScroll() {
        const sentinel = document.getElementById('scroll-sentinel');
        observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                renderBatch();
            }
        }, {
            rootMargin: '200px'
        });
        observer.observe(sentinel);
    }

    async function init() {
        const container = document.getElementById('meetings-list');

        // Static mode: use preloaded data if available
        const preloadedEl = document.getElementById('preloaded-meetings');
        if (preloadedEl) {
            const data = JSON.parse(preloadedEl.textContent);
            totalCount = data.total_count;
            const meetings = data.meetings;

            if (meetings.length === 0) {
                container.innerHTML = '<div class="empty">No meetings found.</div>';
                return;
            }

            renderMeetingCards(meetings, container, true);
            meetings.forEach(m => loadTopics(m.meeting_id, m.title));
            return;
        }

        // Dynamic mode: show skeletons, fetch, render first batch
        const skeletonCount = calcBatchSize();
        container.innerHTML = skeletonCard().repeat(skeletonCount);

        await fetchNextApiPage();
        container.innerHTML = '';
        await renderBatch();
        setupInfiniteScroll();
    }

    init();
</script>
{% endblock %}
