<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YXEMinutes{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Root-relative rather than absolute: a meeting page sits one
         directory down, and the same markup has to be right on the Flask
         app as on the deployed site. -->
    <link rel="alternate" type="application/atom+xml" title="YXEMinutes — daily" href="/feed.xml">
    <link rel="alternate" type="application/atom+xml" title="YXEMinutes — every item" href="/feed-items.xml">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">YXEMinutes</a>
            <span class="tagline">Plain-language summaries of City Council meetings</span>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>
            Data sourced from
            <a href="https://pub-saskatoon.escribemeetings.com/" target="_blank" rel="noopener">
                City of Saskatoon eSCRIBE Portal
            </a>.
            Summaries are AI-generated and may not be perfectly accurate.
        </p>
        <!-- Autodiscovery is invisible, so the one visible line is what
             a returning reader actually finds. In the footer because it
             is for someone coming back, not for a first visit. -->
        <p class="footer-feeds">
            Follow by feed —
            <a href="/feed.xml">a day at a time</a>
            or <a href="/feed-items.xml">every item</a>.
        </p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
